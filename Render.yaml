services:
  - type: web
    name: revenus-plus-api
    runtime: python
    plan: free
    region: frankfurt

    buildCommand: >
      rm -rf deploy &&
      mkdir deploy &&
      unzip -o revenus-plus-render-admin.zip -d deploy &&
      REQ=$(find deploy -name requirements.txt | head -1) &&
      pip install -r "$REQ"

    startCommand: >
      APP=$(find deploy -path "*/app/main.py" | head -1) &&
      cd "$(dirname "$APP")/.." &&
      uvicorn app.main:app --host 0.0.0.0 --port $PORT

    healthCheckPath: /api/health

    envVars:
      - key: SECRET_KEY
        generateValue: true

      - key: DATABASE_URL
        fromDatabase:
          name: revenus-plus-db
          property: connectionString

      - key: CORS_ORIGINS
        value: "*"

      - key: ADMIN_EMAILS
        sync: false

  - type: web
    name: revenus-plus-frontend
    runtime: static

    buildCommand: >
      rm -rf deploy &&
      mkdir deploy &&
      unzip -o revenus-plus-render-admin.zip -d deploy &&
      INDEX=$(find deploy -name index.html | head -1) &&
      FRONT=$(dirname "$INDEX") &&
      mkdir -p site &&
      cp -R "$FRONT"/. site/

    staticPublishPath: site
